name: CI-Test

on:
  push:
    branches: '**'

env:
  IMAGE_NAME: transmi-vue

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: npm ci --progress=false

      - name: Test
        run: npm run test:unit

      - name: Lint
        run: npm run lint
