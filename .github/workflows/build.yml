name: CI-Build

on:
  push:
    branches: 
      - master

env:
  IMAGE_NAME: transmi-vue

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(node -p -e "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: npm install
        run: npm ci --progress=false
      - name: npm build
        run: npm run build

      - name: Publish artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ steps.version.outputs.version }}
          path: ./dist

  docker:
    needs: build
    runs-on: ubuntu-22.04
    if: contains(github.ref, 'master')
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ needs.build.outputs.version }}
          path: ./dist

      - name: Get image name
        id: name
        run: echo "image_name=$(echo ${{ github.repository_owner }}/$IMAGE_NAME | tr '[A-Z]' '[a-z]')" >> "$GITHUB_OUTPUT"

      - name: Build docker image
        run: docker build . --file Dockerfile --tag ${{ steps.name.outputs.image_name }}:latest

      - name: Log into GitHub Container Registry
        run: echo "${{ secrets.CR_PAT }}" | docker login --username nibelungens --password-stdin
      - name: Push image to GitHub Container Registry
        run: |
          docker push ${{ steps.name.outputs.image_name }}:latest
          docker tag ${{ steps.name.outputs.image_name }}:latest ${{ steps.name.outputs.image_name }}:${{ needs.build.outputs.version }}
          docker push ${{ steps.name.outputs.image_name }}:${{ needs.build.outputs.version }}